name: Build and Release Windows EXE

on:
  workflow_dispatch:
    inputs:
      force:
        description: '即使对应版本的 Release 已存在，也强制重新打包并覆盖附件'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release condition
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decide whether to build and release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            REL_VER="${TAG#v}"
            SHOULD_RELEASE="true"
          else
            TAG="v${PKG_VER}"
            REL_VER="${PKG_VER}"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
              SHOULD_RELEASE="true"
            elif gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $TAG already exists; skipping auto-release."
              SHOULD_RELEASE="false"
            else
              echo "Release $TAG does not exist yet; triggering build and release."
              SHOULD_RELEASE="true"
            fi
          fi
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${REL_VER}" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build Windows EXE & Publish Release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download FFmpeg & FFprobe (gyan essentials)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tmpDir = Join-Path $env:RUNNER_TEMP "ffmpeg-dl"
          New-Item -ItemType Directory -Force -Path $tmpDir, "bin" | Out-Null
          gh release download --repo GyanD/codexffmpeg --pattern "*essentials_build.zip" --dir $tmpDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem -Path $tmpDir -Filter "*essentials_build.zip" | Select-Object -First 1
          if (-not $zip) { throw "Failed to download FFmpeg essentials zip" }
          Expand-Archive -Path $zip.FullName -DestinationPath $tmpDir -Force
          $ffmpeg = Get-ChildItem -Path $tmpDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $tmpDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "ffmpeg.exe or ffprobe.exe not found in archive" }
          Copy-Item $ffmpeg.FullName "bin\ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "bin\ffprobe.exe" -Force

      - name: Run smoke tests
        run: node scripts/smoke-test.js

      - name: Build Windows executables
        run: npm run dist

      - name: Create Release and upload EXE assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VGT_HOTFIX_PRIVATE_KEY: ${{ secrets.VGT_HOTFIX_PRIVATE_KEY }}
          TAG: ${{ needs.check.outputs.tag }}
          REL_VER: ${{ needs.check.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $portableSrc = Get-ChildItem -Path "release" -Filter "*便携版.exe" | Select-Object -First 1
          $setupSrc = Get-ChildItem -Path "release" -Filter "*安装版.exe" | Select-Object -First 1
          if (-not $portableSrc -or -not $setupSrc) {
            throw "Expected portable and setup .exe artifacts in release/"
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          $portablePath = Join-Path $stageDir "video-gif-toolbox-$REL_VER-portable.exe"
          $setupPath = Join-Path $stageDir "video-gif-toolbox-$REL_VER-setup.exe"
          Copy-Item $portableSrc.FullName $portablePath -Force
          Copy-Item $setupSrc.FullName $setupPath -Force

          node scripts/build-hotfix.js --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $previewArgs = @()
          $releaseTitle = $TAG
          if ($REL_VER.StartsWith('0.')) {
            if ($REL_VER -notmatch '^0\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'Use 0.x.y for a test version.'
            }
            $previewArgs = @('--prerelease')
            $releaseTitle = "$TAG (Beta)"
          }
          $draft = gh release view $TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "$releaseTitle" `
              --generate-notes --draft @previewArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $draft = 'true'
          }

          # Sequential upload with ASCII filenames + Chinese display labels to prevent GitHub asset name collisions
          gh release upload $TAG "${portablePath}#视频GIF工具箱-${REL_VER}-便携版.exe" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $TAG "${setupPath}#视频GIF工具箱-${REL_VER}-安装版.exe" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $TAG "release/hotfix-bundle-$REL_VER.zip" "release/hotfix-manifest.json" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($draft -eq 'true') {
            gh release edit $TAG --repo $env:GITHUB_REPOSITORY --draft=false @previewArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
