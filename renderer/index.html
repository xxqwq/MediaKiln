<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file:; img-src 'self' file: data:" />
  <title>视频 · GIF 工具箱</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="workflow/workflow.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <rect x="3" y="5" width="18" height="14" rx="3.5" stroke="currentColor" stroke-width="1.9"/>
          <path d="M10.2 9.4v5.2a.5.5 0 0 0 .76.43l4.2-2.6a.5.5 0 0 0 0-.86l-4.2-2.6a.5.5 0 0 0-.76.43z" fill="currentColor"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="logo-title">视频 · GIF 工具箱</div>
        <div class="logo-sub">本地离线处理</div>
      </div>
    </div>
    <div class="mode-switch" id="mode-switch">
      <button class="mode-btn active" data-mode="single" id="mode-btn-single">🛠️ 单工具</button>
      <button class="mode-btn" data-mode="workflow" id="mode-btn-workflow">🕸️ 节点画布</button>
    </div>
    <input type="search" id="nav-search" class="nav-search" placeholder="搜索功能（gif / 图片 / pdf / 去静音 / word…）" />
    <nav id="nav"></nav>
    <div class="sidebar-ver-bar" id="sidebar-ver-bar">
      <button type="button" class="ver-pill" id="btn-check-update" title="检查更新 / 热更新设置">
        <span class="ver-dot hidden" id="ver-dot"></span>
        <span id="ver-label">公开测试版</span>
      </button>
    </div>
    <div class="sidebar-foot" id="sidebar-foot">本地 FFmpeg 9.0 · Ctrl+O 选文件 · Ctrl+V 粘贴 · 空格播放</div>
  </aside>

  <main class="main" id="single-main">
    <header class="header">
      <div class="header-top">
        <div class="header-title-wrap">
          <div class="feature-icon-box" id="feature-icon-box" aria-hidden="true"></div>
          <div>
            <div class="feature-title-line">
              <h1 id="feature-title">视频转 GIF</h1>
              <span class="feature-group-pill" id="feature-group-pill">转换</span>
            </div>
            <p id="feature-desc" class="muted"></p>
          </div>
        </div>
        <div class="global-prefs">
          <label class="pref-item">
            <span>输出位置</span>
            <select id="pref-out-mode">
              <option value="same">源文件同目录</option>
              <option value="subdir">output 子目录</option>
              <option value="custom">自定义文件夹…</option>
            </select>
          </label>
          <button id="pref-out-dir-btn" class="btn btn-ghost btn-sm hidden" title="点击更改输出文件夹"></button>
          <label class="pref-item">
            <span>硬件加速</span>
            <select id="pref-hw">
              <option value="cpu">CPU（最稳）</option>
              <option value="auto">自动检测 GPU</option>
              <option value="h264_nvenc">NVIDIA NVENC</option>
              <option value="h264_qsv">Intel QSV</option>
              <option value="h264_amf">AMD AMF</option>
            </select>
          </label>
          <label class="pref-check" title="输出文件若已存在，自动追加 _1、_2 编号，避免覆盖旧结果">
            <input type="checkbox" id="pref-no-overwrite" checked />
            <span>防覆盖编号</span>
          </label>
        </div>
      </div>
    </header>

    <section id="dropzone" class="dropzone">
      <div class="dz-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9M16 16l-4-4-4 4"/></svg>
      </div>
      <div class="dz-text">拖入文件到这里，或 <span class="link">点击选择文件</span></div>
      <div id="dz-hint" class="dz-hint muted"></div>
      <div id="dz-formats" class="dz-formats" aria-hidden="true"></div>
    </section>

    <section id="file-card" class="file-card hidden">
      <div id="preview-box" class="preview-box"></div>
      <div class="file-meta">
        <div id="file-name" class="file-name"></div>
        <div id="file-info" class="file-info"></div>
        <div class="file-actions">
          <button id="btn-replace" class="btn btn-ghost btn-sm">换一个文件</button>
          <button id="btn-add-more" class="btn btn-ghost btn-sm hidden">+ 添加文件</button>
          <button id="btn-zoom-preview" class="btn btn-ghost btn-sm hidden">⛶ 放大预览</button>
          <button id="btn-send-wf" class="btn btn-ghost btn-sm" title="将当前文件或队列发送到节点工作流画布">🕸️ 发往画布</button>
        </div>
      </div>
    </section>

    <section id="batch-list" class="batch-list hidden"></section>

    <section id="params" class="params hidden"></section>

    <section class="action-bar hidden" id="action-bar">
      <button id="btn-run" class="btn btn-primary">开始转换</button>
      <button id="btn-cancel" class="btn btn-danger hidden">取消</button>
    </section>

    <section id="progress-area" class="progress-area hidden">
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-text" class="muted progress-text">准备中…</div>
    </section>

    <section id="result-card" class="result-card hidden"></section>
  </main>

  <main class="wf-main hidden" id="workflow-main"></main>

  <div id="toast" class="toast hidden"></div>
  <script src="ui/icons.js"></script>
  <script src="ui/crop-canvas.js"></script>
  <script src="ui/params-panel.js"></script>
  <script src="ui/lightbox.js"></script>
  <script src="ui/updater.js"></script>
  <script src="features/video-gif.js"></script>
  <script src="features/image.js"></script>
  <script src="features/svg.js"></script>
  <script src="features/document.js"></script>
  <script src="workflow/node-registry.js"></script>
  <script src="workflow/engine.js"></script>
  <script src="workflow/templates.js"></script>
  <script src="workflow/modals.js"></script>
  <script src="workflow/canvas.js"></script>
  <script src="app.js"></script>
</body>
</html>
